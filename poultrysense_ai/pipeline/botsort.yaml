# PoultrySense tracker config for BoT-SORT (chicken tracking)
# Optimized for fast-running chickens & occlusion recovery
tracker_type: botsort
# Detector reports down to DETECTOR_CONF (0.15) so the tracker's second
# association stage can keep a track alive through motion blur. New tracks
# still require DETECTION_CONF (0.45) via new_track_thresh.
track_high_thresh: 0.45
track_low_thresh: 0.15
new_track_thresh: 0.45
track_buffer: 180
match_thresh: 0.70
fuse_score: true

# BoT-SORT specifics
# Compensate for hand-held camera pans/shakes before matching boxes. Without
# this, every chicken jumps on screen together and BoT-SORT can create/swap IDs.
# sparseOptFlow is lighter than ORB/SIFT and is appropriate for this live feed.
gmc_method: sparseOptFlow

# ReID is DISABLED on purpose. The only appearance model shipped with the
# project (yolo26n-reid.onnx) is a generic person-ReID network: its embeddings
# are meaningless for chickens, so appearance matching adds latency and can
# hijack a correct IoU/Kalman association. BoT-SORT without ReID uses the
# same IoU + Kalman association as ByteTrack, which is what commercial fixed-camera
# trackers (DeepStream, Frigate) run. Set with_reid: true only if you train a
# chicken-specific ReID model and point `model:` at it.
proximity_thresh: 0.85
appearance_thresh: 0.55
with_reid: false
model: yolo26n-reid.onnx
