# PoultrySense tracker config for BoT-SORT (chicken tracking)
# Optimized for high-FPS CPU tracking without ReID inference bottleneck
tracker_type: botsort
# Detector reports down to DETECTOR_CONF (0.25) so the tracker's second
# association stage can keep a track alive through motion blur.
track_high_thresh: 0.35
track_low_thresh: 0.15
new_track_thresh: 0.35
track_buffer: 60
match_thresh: 0.50
fuse_score: true

# BoT-SORT specifics
# Compensate for hand-held camera pans/shakes before matching boxes. Without
# this, every chicken jumps on screen together and BoT-SORT can create/swap IDs.
# sparseOptFlow is lighter than ORB/SIFT and is appropriate for this live feed.
gmc_method: sparseOptFlow

# Fast Kalman & spatial tracking without CPU ReID bottleneck
proximity_thresh: 0.80
appearance_thresh: 0.25
with_reid: false
model: auto
