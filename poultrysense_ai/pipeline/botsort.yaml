# PoultrySense tracker config for BoT-SORT (chicken tracking)
# Optimized for fast-running chickens & occlusion recovery
tracker_type: botsort
# The detector runs at conf 0.30, so the tracker must accept tracks from 0.30
# upward and keep tracking down to 0.15 during turns and motion blur.
track_high_thresh: 0.30
track_low_thresh: 0.15
new_track_thresh: 0.30
track_buffer: 90
match_thresh: 0.70
fuse_score: true

# BoT-SORT specifics
gmc_method: none # static USB coop camera: GMC burns CPU for zero gain

# ReID: appearance memory per track
proximity_thresh: 0.85
appearance_thresh: 0.55
with_reid: true
model: yolo26n-reid.onnx
