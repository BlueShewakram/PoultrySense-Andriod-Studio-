# PoultrySense tracker config for BoT-SORT (chicken tracking)
# Optimized for fast-running chickens & occlusion recovery
tracker_type: botsort
track_high_thresh: 0.45
track_low_thresh: 0.25
new_track_thresh: 0.48
track_buffer: 100
match_thresh: 0.75
fuse_score: true

# BoT-SORT specifics
gmc_method: none # static USB coop camera: GMC burns CPU for zero gain

# ReID: appearance memory per track
# Dedicated ReID encoder (512-d embeddings, CPU/ONNX) instead of the "auto"
# fallback, which silently swaps to yolo26n-cls.pt on OpenVINO detectors.
# Downloaded automatically by Ultralytics on first run.
proximity_thresh: 0.55
appearance_thresh: 0.65
with_reid: true
model: yolo26n-reid.onnx
